<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <!-- Largura lógica de 1280: em TVs 1920x1080 a interface é ampliada 1,5x (leitura a distância). -->
    <meta name="viewport" content="width=1280, user-scalable=no" />
    <meta name="referrer" content="no-referrer" />
    <title>TuiTV</title>
    <script>
      try {
        if (localStorage.getItem('tuitv-theme') === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
